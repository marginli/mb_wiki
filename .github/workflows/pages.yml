# 每次推上 main，自動用 tools/build_site.py 產生網站並部署到 GitHub Pages。
# 網站不含全文 PDF（papers/*.pdf 不進 git，build_site.py 也不會連進 site/）。
name: 部署網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install markdown pillow
      - name: 產生網站
        run: python3 tools/build_site.py
      - name: 確認網站裡沒有 PDF
        run: |
          if find site -iname '*.pdf' | grep -q .; then echo "site/ 裡有 PDF，停止部署"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
